name: Build Nexus Tech

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-1122-fg23-${{ runner.os }}
          restore-keys: |
            gradle-1122-fg23-

      - name: Install Gradle 4.9
        run: |
          curl -fsSL -o gradle-4.9-bin.zip https://services.gradle.org/distributions/gradle-4.9-bin.zip
          unzip -q gradle-4.9-bin.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-4.9/bin" >> "$GITHUB_PATH"

      - name: Build with Gradle
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Report failure log to issue
        if: failure()
        run: |
          FENCE=$(printf '\140\140\140')
          {
            echo "**Build falhou** - run ${{ github.run_number }} (commit ${{ github.sha }})"
            echo ""
            printf '%s\n' "$FENCE"
            echo "--- ambiente ---"
            command -v gradle || echo "(gradle ausente do PATH)"
            java -version 2>&1 || true
            echo "--- fim do log do gradle ---"
            tail -n 250 gradle-build.log 2>/dev/null || echo "(sem log do gradle)"
            echo "--- erros javac ---"
            grep -n "error:" gradle-build.log | head -n 40 || true
            echo "--- what went wrong ---"
            grep -A 12 "What went wrong" gradle-build.log | head -n 30 || true
            printf '%s\n' "$FENCE"
          } > /tmp/failure.md
          BODY="$(jq -Rs . /tmp/failure.md)"
          curl -s -o /tmp/resp.json -w "HTTP %{http_code}\n" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -d "{\"body\": $BODY}" \
            "https://api.github.com/repos/mikael8367/Nexus-Tech-1.12.2/issues/4/comments"

      - name: Upload Build Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-Tech-Mod-JAR
          path: build/libs/*.jar
          retention-days: 30

      - name: Create GitHub Release
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: nexus-tech-build-${{ github.run_number }}
          name: "Nexus Tech 1.12.2 - Build ${{ github.run_number }}"
          body: "Build automatico gerado pelo GitHub Actions (ForgeGradle 2.3 + Gradle 4.9)."
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
